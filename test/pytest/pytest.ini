[pytest]
# The vacuity layer is loaded here rather than imported by a conftest, so that no
# test file and no invocation can opt out of it.
addopts = -p pgc_vacuity -ra
# strict: an xfail that unexpectedly passes is a result nobody was told about.
# Measured: non-strict xfail reports 1 xpassed and exits 0.
xfail_strict = true
testpaths = .
